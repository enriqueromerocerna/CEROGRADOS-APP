<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cero Grados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B0A45;
  --navy2:#2A0C62;
  --fucsia:#FF018F;
  --amarillo:#FFCC00;
  --morado:#2A0C62;
  --frost:#FFE6F4;
  --raspberry:#FF018F;
  --lime:#FFCC00;
  --blueberry:#B347FF;
  --mango:#FFCC00;
  --white:#FFF7FC;
  --muted:#C9A9E8;
  --line:rgba(255,230,244,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:radial-gradient(circle at 15% 0%, #4A1088 0%, var(--navy) 45%, #10052B 100%);
  color:var(--white);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.brand{display:flex;align-items:center;gap:12px;}
.mark{
  width:52px;height:52px;border-radius:50%;
  background:var(--white);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 24px rgba(255,1,143,0.35);
  flex-shrink:0;
  overflow:hidden;
}
.mark img{width:78%;height:78%;object-fit:contain;}
.brand h1{font-size:22px;font-weight:800;letter-spacing:0.2px;}
.brand p{font-size:12px;color:var(--muted);margin-top:2px;}
.mode-toggle{
  display:flex;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:100px;padding:4px;gap:2px;
}
.mode-toggle button{
  border:none;background:transparent;color:var(--muted);font-family:'Inter';font-weight:600;font-size:12.5px;
  padding:8px 14px;border-radius:100px;cursor:pointer;transition:all .2s;
}
.mode-toggle button.active{background:var(--white);color:var(--navy);}

/* TABS */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;padding-bottom:4px;}
.tab{
  white-space:nowrap;padding:10px 16px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,0.03);color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;
  transition:all .2s;
}
.tab.active{background:var(--white);color:var(--navy);border-color:var(--white);}

.panel{display:none;animation:fade .25s ease;}
.panel.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:20px;}
.stat{
  background:rgba(255,255,255,0.045);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden;
}
.stat::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;}
.stat.c-raspberry::before{background:var(--raspberry);}
.stat.c-lime::before{background:var(--lime);}
.stat.c-blueberry::before{background:var(--blueberry);}
.stat.c-mango::before{background:var(--mango);}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.stat .val{font-family:'Baloo 2';font-size:26px;font-weight:700;}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title h2{font-size:18px;font-weight:700;}
.section-title span{font-size:12px;color:var(--muted);}

.card{background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px;}
label{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
input,select{
  width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:10px;color:var(--white);
  padding:10px 12px;font-size:14px;font-family:'Inter';
}
input:focus,select:focus{outline:none;border-color:var(--blueberry);}
button.btn{
  border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:'Inter';
  transition:transform .15s;
}
button.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--lime);color:var(--navy);}
.btn-ghost{background:rgba(255,255,255,0.08);color:var(--white);}
.btn-danger{background:rgba(255,61,127,0.15);color:var(--raspberry);border:1px solid rgba(255,61,127,0.3);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:10px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;}
.tag-yape{background:rgba(61,155,255,0.18);color:var(--blueberry);}
.tag-efectivo{background:rgba(182,255,59,0.18);color:var(--lime);}
.tag-gasto{background:rgba(255,61,127,0.18);color:var(--raspberry);}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;}
.del{cursor:pointer;color:var(--muted);font-size:16px;}
.del:hover{color:var(--raspberry);}

/* Inversion / equipo cards */
.equip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
.equip-card{background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:18px;padding:16px;}
.equip-card h3{font-size:15px;margin-bottom:10px;color:var(--frost);}
.equip-specs{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.equip-specs b{color:var(--white);font-weight:600;}
.equip-cost{font-family:'Baloo 2';font-size:19px;font-weight:700;color:var(--mango);}

.bar-outer{height:10px;border-radius:100px;background:rgba(255,255,255,0.07);overflow:hidden;margin:14px 0 6px;}
.bar-inner{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--blueberry),var(--raspberry),var(--mango),var(--lime));}

.hidden{display:none !important;}
.investor-badge{
  background:linear-gradient(90deg,var(--raspberry),var(--mango));color:var(--navy);font-weight:800;font-size:11px;
  padding:5px 12px;border-radius:100px;display:inline-block;margin-bottom:16px;
}
.pin-box{max-width:280px;margin:60px auto;text-align:center;}
.pin-box input{text-align:center;letter-spacing:4px;font-size:18px;}
.footer-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:40px;line-height:1.6;}
</style>
</head>

};

const STORAGE_KEYS = { finanzas:'finanzas', inventario:'inventario', inversion:'inversion', config:'config' };
let state = { finanzas:[], inventario:[], inversion:[], config:{pin:'2027'} };
let mode = 'admin'; // 'admin' | 'investor'
let unlocked = (localStorage.getItem('cg_unlocked') === '1');
let tab = 'resumen';
let db = null;

function iniciarSincronizacion(){
  Object.entries(STORAGE_KEYS).forEach(([key, docId])=>{
    db.collection('cerogrados').doc(docId).onSnapshot(snap=>{
      if(snap.exists){
        const data = snap.data();
        if(data && typeof data.value === 'string'){
          try{ state[key] = JSON.parse(data.value); }catch(e){ /* dato corrupto, se ignora */ }
        }
      }
      render();
    }, err=>{
      console.error('Error de sincronización con Firebase', docId, err);
    });
  });
}

async function save(key){
  try{
    await db.collection('cerogrados').doc(STORAGE_KEYS[key]).set({
      value: JSON.stringify(state[key]),
      actualizado: new Date().toISOString()
    });
  }catch(e){
    console.error('No se pudo guardar', key, e);
    alert('No se pudo guardar. Revisa tu conexión a internet.');
  }
}

function fmt(n){ return 'S/ ' + Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function render(){
  const app = document.getElementById('app');
  const isInvestor = mode==='investor';

  if(mode==='admin' && !unlocked){
    app.innerHTML = pinScreen();
    attachPinHandlers();
    return;
  }

  app.innerHTML = `
    ${header()}
    ${isInvestor ? `<div class="investor-badge">👁 VISTA INVERSIONISTA — SOLO LECTURA</div>` : ''}
    ${isInvestor ? tabsHtml(['resumen','inversion']) : tabsHtml(['resumen','finanzas','inventario','inversion'])}
    <div id="panels"></div>
    ${!isInvestor ? `<p class="footer-note">Cero Grados · datos guardados en la nube · esta vista de administración usa un PIN simple como candado básico, no es seguridad de nivel bancario.</p>` : `<p class="footer-note">Cero Grados · resumen para inversionistas, actualizado en tiempo real.</p>`}
  `;
  renderPanels(isInvestor);
  attachHeaderHandlers();
}

function attachPinHandlers(){
  document.getElementById('pinBtn').onclick = ()=>{
    const v = document.getElementById('pinInput').value.trim();
    if(v === state.config.pin){ unlocked = true; localStorage.setItem('cg_unlocked','1'); render(); }
    else document.getElementById('pinErr').textContent = 'PIN incorrecto.';
  };
  document.getElementById('toInvestor').onclick = ()=>{ mode='investor'; render(); };
}

function attachHeaderHandlers(){
  document.querySelectorAll('.mode-toggle button').forEach(b=>{
    b.onclick = ()=>{ mode = b.dataset.m; if(mode==='admin' && !unlocked){} render(); };
  });
  document.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ tab = b.dataset.t; render(); };
  });
}

function tabsHtml(list){
  const labels = {resumen:'Resumen', finanzas:'Finanzas', inventario:'Inventario', inversion:'Inversión Food Truck'};
  if(!list.includes(tab)) tab = list[0];
  return `<div class="tabs">${list.map(t=>`<button class="tab ${tab===t?'active':''}" data-t="${t}">${labels[t]}</button>`).join('')}</div>`;
}

function renderPanels(isInvestor){
  const p = document.getElementById('panels');
  if(tab==='resumen') p.innerHTML = panelResumen(isInvestor);
  if(tab==='finanzas' && !isInvestor) p.innerHTML = panelFinanzas();
  if(tab==='inventario' && !isInvestor) p.innerHTML = panelInventario();
  if(tab==='inversion') p.innerHTML = panelInversion(isInvestor);
  attachPanelHandlers();
}

/* ---------- RESUMEN ---------- */
function panelResumen(isInvestor){
  const hoy = todayStr();
  const entradasHoy = state.finanzas.filter(f=>f.fecha===hoy);
  const ingresosHoy = entradasHoy.filter(f=>f.tipo==='ingreso').reduce((a,b)=>a+Number(b.monto),0);
  const gastosHoy = entradasHoy.filter(f=>f.tipo==='gasto').reduce((a,b)=>a+Number(b.monto),0);
  const yapeHoy = entradasHoy.filter(f=>f.tipo==='ingreso' && f.metodo==='YAPE').reduce((a,b)=>a+Number(b.monto),0);
  const efectivoHoy = entradasHoy.filter(f=>f.tipo==='ingreso' && f.metodo==='Efectivo').reduce((a,b)=>a+Number(b.monto),0);
  const totalInversion = state.inversion.reduce((a,b)=>a+Number(b.costo),0);

  let cards = `
    <div class="grid">
      <div class="stat c-lime"><div class="lbl">Ingresos hoy</div><div class="val">${fmt(ingresosHoy)}</div><div class="sub">YAPE ${fmt(yapeHoy)} · Efectivo ${fmt(efectivoHoy)}</div></div>
      <div class="stat c-raspberry"><div class="lbl">Gastos hoy</div><div class="val">${fmt(gastosHoy)}</div><div class="sub">${entradasHoy.filter(f=>f.tipo==='gasto').length} movimiento(s)</div></div>

const PRECIOS = { Raspadilla: 5, Marciano: 2 };
const PRODUCTOS_POR_TIPO = {
  ingreso: ['Raspadilla','Marciano','Ambos','Otro'],
  gasto: ['Almuerzo','Otro']
};

function actualizarFormularioFinanza(){
  const tipoSel = document.getElementById('fTipo');
  const metodoWrap = document.getElementById('fMetodoWrap');
  const productoWrap = document.getElementById('fProductoWrap');
  const productoSel = document.getElementById('fProducto');
  if(!tipoSel || !productoSel) return;

  const tipo = tipoSel.value;
  metodoWrap.style.display = (tipo==='ingreso') ? '' : 'none';

  const opciones = PRODUCTOS_POR_TIPO[tipo] || [];
  productoSel.innerHTML = opciones.map(o=>`<option value="${o}">${o}</option>`).join('');
  productoWrap.style.display = opciones.length ? '' : 'none';

  actualizarCamposProducto();
}

function actualizarCamposProducto(){
  const tipo = document.getElementById('fTipo').value;
  const producto = document.getElementById('fProducto').value;
  const cantidadWrap = document.getElementById('fCantidadWrap');
  const cantidadLabel = document.getElementById('fCantidadLabel');
  const ambosWrap = document.getElementById('fAmbosWrap');
  const montoInput = document.getElementById('fMonto');
  const detalle = document.getElementById('fDetalle');

  cantidadWrap.style.display = 'none';
  ambosWrap.style.display = 'none';
  montoInput.readOnly = false;

  if(tipo==='ingreso' && (producto==='Raspadilla' || producto==='Marciano')){
    cantidadWrap.style.display = '';
    cantidadLabel.textContent = `Cantidad (${producto}, S/ ${PRECIOS[producto]} c/u)`;
    montoInput.readOnly = true;
    calcularMontoSimple();
  } else if(tipo==='ingreso' && producto==='Ambos'){
    ambosWrap.style.display = '';
    montoInput.readOnly = true;
    calcularMontoAmbos();
  } else if(producto==='Otro'){
    montoInput.value = '';
    detalle.value = '';
    detalle.focus();
  } else if(producto==='Almuerzo'){
    detalle.value = 'Almuerzo';
  }
}

function calcularMontoSimple(){
  const producto = document.getElementById('fProducto').value;
  const cant = parseFloat(document.getElementById('fCantidad').value) || 0;
  const precio = PRECIOS[producto] || 0;
  document.getElementById('fMonto').value = (cant*precio).toFixed(2);
  document.getElementById('fDetalle').value = cant>0 ? `${cant} ${producto}` : producto;
}

function calcularMontoAmbos(){
  const cR = parseFloat(document.getElementById('fCantRaspadilla').value) || 0;
  const cM = parseFloat(document.getElementById('fCantMarciano').value) || 0;
  const total = cR*PRECIOS.Raspadilla + cM*PRECIOS.Marciano;
  document.getElementById('fMonto').value = total.toFixed(2);
  const partes = [];
  if(cR>0) partes.push(`${cR} Raspadilla`);
  if(cM>0) partes.push(`${cM} Marciano`);
  document.getElementById('fDetalle').value = partes.join(' + ') || 'Raspadilla + Marciano';
}

/* ---------- DICTADO POR VOZ (Finanzas) ---------- */
const NUM_PALABRAS = {
  'un':1,'uno':1,'una':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,
  'ocho':8,'nueve':9,'diez':10,'once':11,'doce':12,'trece':13,'catorce':14,'quince':15,
  'dieciseis':16,'diecisiete':17,'dieciocho':18,'diecinueve':19,'veinte':20,
  'veintiuno':21,'veintidos':22,'veintitres':23,'veinticuatro':24,'veinticinco':25,
  'treinta':30,'cuarenta':40,'cincuenta':50
};
function normalizarTexto(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function extraerNumeroCerca(palabras, idx, ventana){
  // busca un número (dígito o palabra) dentro de `ventana` posiciones antes del índice idx
  for(let i=idx-1; i>=Math.max(0, idx-ventana); i--){
    const w = palabras[i].replace(/[.,]/g,'');
    if(/^\d+(\.\d+)?$/.test(w)) return parseFloat(w);
    if(NUM_PALABRAS[w] !== undefined) return NUM_PALABRAS[w];
  }
  return null;
}
function parseDictadoFinanza(textoOriginal){
  const texto = normalizarTexto(textoOriginal);
  const palabras = texto.split(/\s+/);
  const resultado = { tipo:null, producto:null, metodo:null, cantidad:null,
    cantRaspadilla:0, cantMarciano:0, monto:null, detalle:null };

  const esGasto = /\b(gasto|gaste|compre|compra|pague|pago|gastos)\b/.test(texto);
  resultado.tipo = esGasto ? 'gasto' : 'ingreso';

  if(/yape/.test(texto)) resultado.metodo = 'YAPE';
  else if(/efectivo|cash/.test(texto)) resultado.metodo = 'Efectivo';

  const tieneRaspadilla = /raspadilla/.test(texto);
  const tieneMarciano = /marciano/.test(texto);

  palabras.forEach((w,i)=>{
    if(w.startsWith('raspadilla')){
      const n = extraerNumeroCerca(palabras, i, 3);
      if(n!==null) resultado.cantRaspadilla += n;
    }
    if(w.startsWith('marciano')){
      const n = extraerNumeroCerca(palabras, i, 3);
      if(n!==null) resultado.cantMarciano += n;
    }
  });

  if(tieneRaspadilla && tieneMarciano){
    resultado.producto = 'Ambos';
  } else if(tieneRaspadilla){
    resultado.producto = 'Raspadilla';
    resultado.cantidad = resultado.cantRaspadilla || null;
  } else if(tieneMarciano){
    resultado.producto = 'Marciano';
    resultado.cantidad = resultado.cantMarciano || null;
  } else if(esGasto){
    resultado.producto = /almuerzo/.test(texto) ? 'Almuerzo' : 'Otro';
  } else {
    resultado.producto = 'Otro';
  }

  // monto explícito: "20 soles", "s/ 20", "s/. 20"
  const montoMatch = texto.match(/(?:s\/\.?\s*)(\d+(\.\d+)?)/) || texto.match(/(\d+(\.\d+)?)\s*soles/);
  if(montoMatch) resultado.monto = parseFloat(montoMatch[1]);
  else {
    // intenta con número en palabras seguido de "soles"
    palabras.forEach((w,i)=>{
      if(w==='soles' && i>0){
        const prev = palabras[i-1];
        if(NUM_PALABRAS[prev]!==undefined) resultado.monto = NUM_PALABRAS[prev];
      }
    });
  }

  if(esGasto && resultado.producto==='Otro'){
    // usa el texto tal cual como detalle, quitando palabras de comando
    resultado.detalle = textoOriginal
      .replace(/\b(gasto|gaste|compre|compra|pague|pago|de|en|soles|efectivo|yape)\b/gi,'')
      .replace(/\s+/g,' ').trim();
  }

  return resultado;
}
function aplicarDictadoAlFormulario(r){
  const fTipo = document.getElementById('fTipo');
  const fMetodo = document.getElementById('fMetodo');
  const fProducto = document.getElementById('fProducto');
  const fCantidad = document.getElementById('fCantidad');
  const fCantRaspadilla = document.getElementById('fCantRaspadilla');
  const fCantMarciano = document.getElementById('fCantMarciano');
  const fMonto = document.getElementById('fMonto');
  const fDetalle = document.getElementById('fDetalle');
  if(!fTipo) return;

  fTipo.value = r.tipo;
  actualizarFormularioFinanza();

  if(r.metodo && fMetodo) fMetodo.value = r.metodo;
  if(r.producto) fProducto.value = r.producto;
  actualizarCamposProducto();

  if(r.producto==='Ambos'){
    if(fCantRaspadilla) fCantRaspadilla.value = r.cantRaspadilla || '';
    if(fCantMarciano) fCantMarciano.value = r.cantMarciano || '';
    calcularMontoAmbos();
  } else if(r.producto==='Raspadilla' || r.producto==='Marciano'){
    if(fCantidad) fCantidad.value = r.cantidad || '';
    calcularMontoSimple();
  }

  if(r.monto!==null) fMonto.value = r.monto.toFixed(2);
  if(r.detalle) fDetalle.value = r.detalle;
}
function attachVoiceHandler(){
  const btn = document.getElementById('voiceBtn');
  const status = document.getElementById('voiceStatus');
  const transcriptWrap = document.getElementById('voiceTranscriptWrap');
  const transcriptEl = document.getElementById('voiceTranscript');
  if(!btn) return;

  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){
    btn.disabled = true;
    status.textContent = 'Tu navegador no soporta dictado por voz. Prueba con Chrome.';
    return;
  }

  btn.onclick = ()=>{
    const rec = new SpeechRec();
    rec.lang = 'es-PE';
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    btn.disabled = true;
    btn.textContent = '🎙️ Escuchando...';
    status.textContent = 'Habla ahora, ej: "tres raspadillas, yape"';

    rec.onresult = (e)=>{
      const texto = e.results[0][0].transcript;
      transcriptWrap.style.display = '';
      transcriptEl.textContent = texto;
      const r = parseDictadoFinanza(texto);
      aplicarDictadoAlFormulario(r);
      status.textContent = 'Revisa los campos y presiona "Agregar movimiento" para confirmar.';
    };
    rec.onerror = (e)=>{
      status.textContent = 'No se pudo escuchar bien. Intenta de nuevo (' + e.error + ').';
    };
    rec.onend = ()=>{
      btn.disabled = false;
      btn.textContent = '🎙️ Dictar movimiento';
    };
    rec.start();
  };
}

function attachPanelHandlers(){
  document.querySelectorAll('.tab').forEach(b=>{ b.onclick = ()=>{ tab=b.dataset.t; render(); }; });
  attachVoiceHandler();

  const tipoSel = document.getElementById('fTipo');
  const productoSel = document.getElementById('fProducto');
  const cantidadInput = document.getElementById('fCantidad');
  const cantRaspadilla = document.getElementById('fCantRaspadilla');
  const cantMarciano = document.getElementById('fCantMarciano');
  if(tipoSel) tipoSel.onchange = actualizarFormularioFinanza;
  if(productoSel) productoSel.onchange = actualizarCamposProducto;
  if(cantidadInput) cantidadInput.oninput = calcularMontoSimple;
  if(cantRaspadilla) cantRaspadilla.oninput = calcularMontoAmbos;
  if(cantMarciano) cantMarciano.oninput = calcularMontoAmbos;
  actualizarFormularioFinanza();

  const addF = document.getElementById('addFinanza');
  if(addF) addF.onclick = async ()=>{
    const tipo = document.getElementById('fTipo').value;
    const monto = parseFloat(document.getElementById('fMonto').value);
    if(!monto || monto<=0){ alert('Ingresa un monto válido.'); return; }
    state.finanzas.push({ id:uid(), tipo, metodo: tipo==='ingreso'?document.getElementById('fMetodo').value:null,
      fecha: document.getElementById('fFecha').value || todayStr(),
      hora: new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'}),
      monto, detalle: document.getElementById('fDetalle').value });
    await save('finanzas'); render();
  };
  const addI = document.getElementById('addInventario');
  if(addI) addI.onclick = async ()=>{
    const nombre = document.getElementById('iNombre').value.trim();
    if(!nombre) return;
    state.inventario.push({ id:uid(), nombre, cantidad: parseFloat(document.getElementById('iCantidad').value)||0,
      unidad: document.getElementById('iUnidad').value || 'unid', costoUnit: parseFloat(document.getElementById('iCosto').value)||0 });
    await save('inventario'); render();
  };
  const addV = document.getElementById('addInversion');
  if(addV) addV.onclick = async ()=>{
    const nombre = document.getElementById('vNombre').value.trim();
    const costo = parseFloat(document.getElementById('vCosto').value);
    if(!nombre || !costo) return;
    state.inversion.push({ id:uid(), nombre, costo, ancho: document.getElementById('vAncho').value,
      alto: document.getElementById('vAlto').value, profundidad: document.getElementById('vProf').value,
      detalle: document.getElementById('vDetalle').value });
    await save('inversion'); render();
  };
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = async ()=>{
      const key = el.dataset.del, id = el.dataset.id;
      state[key] = state[key].filter(x=>x.id!==id);
      await save(key); render();
    };
  });
}
