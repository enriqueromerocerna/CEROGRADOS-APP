<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cero Grados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1730;
  --navy2:#0F2145;
  --card:#122a52;
  --frost:#DCEBFF;
  --raspberry:#FF3D7F;
  --lime:#B6FF3B;
  --blueberry:#3D9BFF;
  --mango:#FFB627;
  --white:#F5F9FF;
  --muted:#8BA3CC;
  --line:rgba(220,235,255,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:radial-gradient(circle at 15% 0%, #14285a 0%, var(--navy) 45%, #060e22 100%);
  color:var(--white);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.brand{display:flex;align-items:center;gap:12px;}
.mark{
  width:52px;height:52px;border-radius:50%;
  background:conic-gradient(from 200deg, var(--blueberry), var(--raspberry), var(--mango), var(--lime), var(--blueberry));
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2';font-weight:800;font-size:13px;color:var(--navy);
  box-shadow:0 0 24px rgba(61,155,255,0.35);
  flex-shrink:0;
}
.brand h1{font-size:22px;font-weight:800;letter-spacing:0.2px;}
.brand p{font-size:12px;color:var(--muted);margin-top:2px;}
.mode-toggle{
  display:flex;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:100px;padding:4px;gap:2px;
}
.mode-toggle button{
  border:none;background:transparent;color:var(--muted);font-family:'Inter';font-weight:600;font-size:12.5px;
  padding:8px 14px;border-radius:100px;cursor:pointer;transition:all .2s;
}
.mode-toggle button.active{background:var(--white);color:var(--navy);}

/* TABS */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;padding-bottom:4px;}
.tab{
  white-space:nowrap;padding:10px 16px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,0.03);color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;
  transition:all .2s;
}
.tab.active{background:var(--white);color:var(--navy);border-color:var(--white);}

.panel{display:none;animation:fade .25s ease;}
.panel.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:20px;}
.stat{
  background:rgba(255,255,255,0.045);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden;
}
.stat::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;}
.stat.c-raspberry::before{background:var(--raspberry);}
.stat.c-lime::before{background:var(--lime);}
.stat.c-blueberry::before{background:var(--blueberry);}
.stat.c-mango::before{background:var(--mango);}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.stat .val{font-family:'Baloo 2';font-size:26px;font-weight:700;}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title h2{font-size:18px;font-weight:700;}
.section-title span{font-size:12px;color:var(--muted);}

.card{background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px;}
label{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
input,select{
  width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:10px;color:var(--white);
  padding:10px 12px;font-size:14px;font-family:'Inter';
}
input:focus,select:focus{outline:none;border-color:var(--blueberry);}
button.btn{
  border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:'Inter';
  transition:transform .15s;
}
button.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--lime);color:var(--navy);}
.btn-ghost{background:rgba(255,255,255,0.08);color:var(--white);}
.btn-danger{background:rgba(255,61,127,0.15);color:var(--raspberry);border:1px solid rgba(255,61,127,0.3);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:10px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;}
.tag-yape{background:rgba(61,155,255,0.18);color:var(--blueberry);}
.tag-efectivo{background:rgba(182,255,59,0.18);color:var(--lime);}
.tag-gasto{background:rgba(255,61,127,0.18);color:var(--raspberry);}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;}
.del{cursor:pointer;color:var(--muted);font-size:16px;}
.del:hover{color:var(--raspberry);}

/* Inversion / equipo cards */
.equip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
.equip-card{background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:18px;padding:16px;}
.equip-card h3{font-size:15px;margin-bottom:10px;color:var(--frost);}
.equip-specs{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.equip-specs b{color:var(--white);font-weight:600;}
.equip-cost{font-family:'Baloo 2';font-size:19px;font-weight:700;color:var(--mango);}

.bar-outer{height:10px;border-radius:100px;background:rgba(255,255,255,0.07);overflow:hidden;margin:14px 0 6px;}
.bar-inner{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--blueberry),var(--raspberry),var(--mango),var(--lime));}

.hidden{display:none !important;}
.investor-badge{
  background:linear-gradient(90deg,var(--raspberry),var(--mango));color:var(--navy);font-weight:800;font-size:11px;
  padding:5px 12px;border-radius:100px;display:inline-block;margin-bottom:16px;
}
.pin-box{max-width:280px;margin:60px auto;text-align:center;}
.pin-box input{text-align:center;letter-spacing:4px;font-size:18px;}
.footer-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:40px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap" id="app">Cargando…</div>

<script>
const STORAGE_KEYS = { finanzas:'finanzas:entries', inventario:'inventario:items', inversion:'inversion:items', config:'config:app' };
let state = { finanzas:[], inventario:[], inversion:[], config:{pin:'2027'} };
let mode = 'admin'; // 'admin' | 'investor'
let unlocked = false;
let tab = 'resumen';

async function loadAll(){
  for(const [key, storageKey] of Object.entries(STORAGE_KEYS)){
    try{
      const r = await window.storage.get(storageKey, true);
      if(r && r.value) state[key] = JSON.parse(r.value);
    }catch(e){ /* no existe aún */ }
  }
}
async function save(key){
  await window.storage.set(STORAGE_KEYS[key], JSON.stringify(state[key]), true);
}

function fmt(n){ return 'S/ ' + Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function render(){
  const app = document.getElementById('app');
  const isInvestor = mode==='investor';

  if(mode==='admin' && !unlocked){
    app.innerHTML = pinScreen();
    attachPinHandlers();
    return;
  }

  app.innerHTML = `
    ${header()}
    ${isInvestor ? `<div class="investor-badge">👁 VISTA INVERSIONISTA — SOLO LECTURA</div>` : ''}
    ${isInvestor ? tabsHtml(['resumen','inversion']) : tabsHtml(['resumen','finanzas','inventario','inversion'])}
    <div id="panels"></div>
    ${!isInvestor ? `<p class="footer-note">Cero Grados · datos guardados en la nube · esta vista de administración usa un PIN simple como candado básico, no es seguridad de nivel bancario.</p>` : `<p class="footer-note">Cero Grados · resumen para inversionistas, actualizado en tiempo real.</p>`}
  `;
  renderPanels(isInvestor);
  attachHeaderHandlers();
}

function pinScreen(){
  return `
    ${header(true)}
    <div class="pin-box">
      <div class="mark" style="margin:0 auto 16px;">0°</div>
      <h2 style="margin-bottom:8px;">Modo administrador</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:18px;">Ingresa el PIN para editar finanzas, inventario e inversión.</p>
      <input id="pinInput" maxlength="6" placeholder="••••" />
      <button class="btn btn-primary" style="width:100%;margin-top:12px;" id="pinBtn">Entrar</button>
      <p id="pinErr" style="color:var(--raspberry);font-size:12px;margin-top:10px;"></p>
      <button class="btn btn-ghost" style="width:100%;margin-top:20px;" id="toInvestor">Ver como inversionista →</button>
    </div>`;
}
function attachPinHandlers(){
  document.getElementById('pinBtn').onclick = ()=>{
    const v = document.getElementById('pinInput').value.trim();
    if(v === state.config.pin){ unlocked = true; render(); }
    else document.getElementById('pinErr').textContent = 'PIN incorrecto.';
  };
  document.getElementById('toInvestor').onclick = ()=>{ mode='investor'; render(); };
}

function header(minimal){
  return `
  <div class="header">
    <div class="brand">
      ${!minimal ? `<div class="mark">0°</div>` : ''}
      <div>
        <h1>Cero Grados</h1>
        <p>Control del negocio & presentación de inversión</p>
      </div>
    </div>
    ${!minimal ? `
    <div class="mode-toggle">
      <button data-m="admin" class="${mode==='admin'?'active':''}">Administrador</button>
      <button data-m="investor" class="${mode==='investor'?'active':''}">Inversionista</button>
    </div>` : ''}
  </div>`;
}
function attachHeaderHandlers(){
  document.querySelectorAll('.mode-toggle button').forEach(b=>{
    b.onclick = ()=>{ mode = b.dataset.m; if(mode==='admin' && !unlocked){} render(); };
  });
  document.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ tab = b.dataset.t; render(); };
  });
}

function tabsHtml(list){
  const labels = {resumen:'Resumen', finanzas:'Finanzas', inventario:'Inventario', inversion:'Inversión Food Truck'};
  if(!list.includes(tab)) tab = list[0];
  return `<div class="tabs">${list.map(t=>`<button class="tab ${tab===t?'active':''}" data-t="${t}">${labels[t]}</button>`).join('')}</div>`;
}

function renderPanels(isInvestor){
  const p = document.getElementById('panels');
  if(tab==='resumen') p.innerHTML = panelResumen(isInvestor);
  if(tab==='finanzas' && !isInvestor) p.innerHTML = panelFinanzas();
  if(tab==='inventario' && !isInvestor) p.innerHTML = panelInventario();
  if(tab==='inversion') p.innerHTML = panelInversion(isInvestor);
  attachPanelHandlers();
}

/* ---------- RESUMEN ---------- */
function panelResumen(isInvestor){
  const hoy = todayStr();
  const entradasHoy = state.finanzas.filter(f=>f.fecha===hoy);
  const ingresosHoy = entradasHoy.filter(f=>f.tipo==='ingreso').reduce((a,b)=>a+Number(b.monto),0);
  const gastosHoy = entradasHoy.filter(f=>f.tipo==='gasto').reduce((a,b)=>a+Number(b.monto),0);
  const yapeHoy = entradasHoy.filter(f=>f.tipo==='ingreso' && f.metodo==='YAPE').reduce((a,b)=>a+Number(b.monto),0);
  const efectivoHoy = entradasHoy.filter(f=>f.tipo==='ingreso' && f.metodo==='Efectivo').reduce((a,b)=>a+Number(b.monto),0);
  const totalInversion = state.inversion.reduce((a,b)=>a+Number(b.costo),0);

  let cards = `
    <div class="grid">
      <div class="stat c-lime"><div class="lbl">Ingresos hoy</div><div class="val">${fmt(ingresosHoy)}</div><div class="sub">YAPE ${fmt(yapeHoy)} · Efectivo ${fmt(efectivoHoy)}</div></div>
      <div class="stat c-raspberry"><div class="lbl">Gastos hoy</div><div class="val">${fmt(gastosHoy)}</div><div class="sub">${entradasHoy.filter(f=>f.tipo==='gasto').length} movimiento(s)</div></div>
      <div class="stat c-blueberry"><div class="lbl">Neto del día</div><div class="val">${fmt(ingresosHoy-gastosHoy)}</div><div class="sub">Ingresos − Gastos</div></div>
      <div class="stat c-mango"><div class="lbl">Inversión Food Truck</div><div class="val">${fmt(totalInversion)}</div><div class="sub">${state.inversion.length} ítem(s) presupuestados</div></div>
    </div>`;

  if(isInvestor){
    // vista curada, sin detalle de gastos internos del día a día
    cards = `
    <div class="grid">
      <div class="stat c-mango"><div class="lbl">Inversión total requerida</div><div class="val">${fmt(totalInversion)}</div><div class="sub">Food Truck · playa Tortugas</div></div>
      <div class="stat c-blueberry"><div class="lbl">Ítems del proyecto</div><div class="val">${state.inversion.length}</div><div class="sub">Ver detalle en la pestaña Inversión</div></div>
    </div>`;
  }

  return cards;
}

/* ---------- FINANZAS ---------- */
function panelFinanzas(){
  const rows = [...state.finanzas].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(f=>`
    <tr>
      <td>${f.fecha}</td>
      <td>${f.tipo==='ingreso' ? `<span class="tag ${f.metodo==='YAPE'?'tag-yape':'tag-efectivo'}">${f.metodo}</span>` : `<span class="tag tag-gasto">Gasto</span>`}</td>
      <td>${f.detalle||'—'}</td>
      <td style="text-align:right;font-weight:700;color:${f.tipo==='ingreso'?'var(--lime)':'var(--raspberry)'}">${f.tipo==='ingreso'?'+':'−'}${fmt(f.monto)}</td>
      <td><span class="del" data-del="finanzas" data-id="${f.id}">✕</span></td>
    </tr>`).join('');

  return `
  <div class="card">
    <h3 style="margin-bottom:14px;font-size:15px;">Registrar movimiento</h3>
    <div class="form-row">
      <div><label>Tipo</label><select id="fTipo"><option value="ingreso">Ingreso</option><option value="gasto">Gasto</option></select></div>
      <div><label>Método (si es ingreso)</label><select id="fMetodo"><option>YAPE</option><option>Efectivo</option></select></div>
      <div><label>Fecha</label><input type="date" id="fFecha" value="${todayStr()}"></div>
      <div><label>Monto (S/)</label><input type="number" step="0.10" id="fMonto" placeholder="0.00"></div>
    </div>
    <div class="form-row">
      <div style="grid-column:1/-1;"><label>Detalle</label><input type="text" id="fDetalle" placeholder="Ej: 8 raspadillas, o compra de vasos"></div>
    </div>
    <button class="btn btn-primary" id="addFinanza">+ Agregar movimiento</button>
  </div>
  <div class="section-title"><h2>Movimientos</h2><span>${state.finanzas.length} registro(s)</span></div>
  <div class="card">
    ${state.finanzas.length===0 ? `<div class="empty">Aún no hay movimientos registrados.</div>` : `
    <table><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th style="text-align:right;">Monto</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`}
  </div>`;
}

/* ---------- INVENTARIO ---------- */
function panelInventario(){
  const rows = state.inventario.map(i=>`
    <tr>
      <td>${i.nombre}</td>
      <td>${i.cantidad} ${i.unidad}</td>
      <td>${fmt(i.costoUnit)}</td>
      <td style="font-weight:700;">${fmt(i.cantidad*i.costoUnit)}</td>
      <td><span class="del" data-del="inventario" data-id="${i.id}">✕</span></td>
    </tr>`).join('');
  const valorTotal = state.inventario.reduce((a,b)=>a+b.cantidad*b.costoUnit,0);

  return `
  <div class="card">
    <h3 style="margin-bottom:14px;font-size:15px;">Agregar producto / insumo</h3>
    <div class="form-row">
      <div><label>Nombre</label><input id="iNombre" placeholder="Ej: Vasos, jarabe fresa..."></div>
      <div><label>Cantidad</label><input type="number" id="iCantidad" placeholder="0"></div>
      <div><label>Unidad</label><input id="iUnidad" placeholder="unid, litros, kg..."></div>
      <div><label>Costo unitario (S/)</label><input type="number" step="0.01" id="iCosto" placeholder="0.00"></div>
    </div>
    <button class="btn btn-primary" id="addInventario">+ Agregar al inventario</button>
  </div>
  <div class="section-title"><h2>Stock actual</h2><span>Valor total: ${fmt(valorTotal)}</span></div>
  <div class="card">
    ${state.inventario.length===0 ? `<div class="empty">Aún no hay productos en el inventario.</div>` : `
    <table><thead><tr><th>Producto</th><th>Cantidad</th><th>Costo unit.</th><th>Total</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`}
  </div>`;
}

/* ---------- INVERSION ---------- */
function panelInversion(isInvestor){
  const total = state.inversion.reduce((a,b)=>a+Number(b.costo),0);
  const colors = ['c-blueberry','c-raspberry','c-mango','c-lime'];
  const cards = state.inversion.map((it,idx)=>`
    <div class="equip-card">
      <div style="display:flex;justify-content:space-between;align-items:start;">
        <h3>${it.nombre}</h3>
        ${!isInvestor ? `<span class="del" data-del="inversion" data-id="${it.id}">✕</span>` : ''}
      </div>
      ${(it.ancho||it.alto||it.profundidad) ? `
      <div class="equip-specs">
        ${it.ancho?`<div>Ancho <b>${it.ancho}</b></div>`:''}
        ${it.alto?`<div>Alto <b>${it.alto}</b></div>`:''}
        ${it.profundidad?`<div>Profundidad <b>${it.profundidad}</b></div>`:''}
      </div>` : ''}
      ${it.detalle ? `<p style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">${it.detalle}</p>` : ''}
      <div class="equip-cost">${fmt(it.costo)}</div>
    </div>`).join('');

  const bars = state.inversion.map((it,idx)=>{
    const pct = total>0 ? (it.costo/total*100).toFixed(1) : 0;
    return `<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;"><span>${it.nombre}</span><span>${pct}%</span></div><div class="bar-outer"><div class="bar-inner" style="width:${pct}%;"></div></div></div>`;
  }).join('');

  return `
  <div class="grid">
    <div class="stat c-mango"><div class="lbl">Inversión total</div><div class="val">${fmt(total)}</div><div class="sub">Food truck · playa Tortugas</div></div>
    <div class="stat c-blueberry"><div class="lbl">Ítems presupuestados</div><div class="val">${state.inversion.length}</div><div class="sub">Equipos y costos del proyecto</div></div>
  </div>
  ${!isInvestor ? `
  <div class="card">
    <h3 style="margin-bottom:14px;font-size:15px;">Agregar ítem de inversión</h3>
    <div class="form-row">
      <div><label>Nombre</label><input id="vNombre" placeholder="Ej: Congeladora, Panel solar, Food truck..."></div>
      <div><label>Costo (S/)</label><input type="number" step="0.01" id="vCosto" placeholder="0.00"></div>
    </div>
    <div class="form-row">
      <div><label>Ancho (opcional)</label><input id="vAncho" placeholder="Ej: 60 cm"></div>
      <div><label>Alto (opcional)</label><input id="vAlto" placeholder="Ej: 85 cm"></div>
      <div><label>Profundidad (opcional)</label><input id="vProf" placeholder="Ej: 55 cm"></div>
    </div>
    <div class="form-row">
      <div style="grid-column:1/-1;"><label>Detalle (opcional)</label><input id="vDetalle" placeholder="Notas adicionales"></div>
    </div>
    <button class="btn btn-primary" id="addInversion">+ Agregar ítem</button>
  </div>` : ''}
  <div class="section-title"><h2>Distribución del presupuesto</h2></div>
  <div class="card">${state.inversion.length===0?`<div class="empty">Aún no hay ítems de inversión.</div>`:bars}</div>
  <div class="section-title"><h2>Detalle de equipos e ítems</h2></div>
  ${state.inversion.length===0 ? `<div class="card"><div class="empty">Agrega el food truck, paneles solares, refrigeradora, congeladoras, etc.</div></div>` : `<div class="equip-grid">${cards}</div>`}
  `;
}

function attachPanelHandlers(){
  document.querySelectorAll('.tab').forEach(b=>{ b.onclick = ()=>{ tab=b.dataset.t; render(); }; });

  const addF = document.getElementById('addFinanza');
  if(addF) addF.onclick = async ()=>{
    const tipo = document.getElementById('fTipo').value;
    const monto = parseFloat(document.getElementById('fMonto').value);
    if(!monto || monto<=0) return;
    state.finanzas.push({ id:uid(), tipo, metodo: tipo==='ingreso'?document.getElementById('fMetodo').value:null,
      fecha: document.getElementById('fFecha').value || todayStr(), monto, detalle: document.getElementById('fDetalle').value });
    await save('finanzas'); render();
  };
  const addI = document.getElementById('addInventario');
  if(addI) addI.onclick = async ()=>{
    const nombre = document.getElementById('iNombre').value.trim();
    if(!nombre) return;
    state.inventario.push({ id:uid(), nombre, cantidad: parseFloat(document.getElementById('iCantidad').value)||0,
      unidad: document.getElementById('iUnidad').value || 'unid', costoUnit: parseFloat(document.getElementById('iCosto').value)||0 });
    await save('inventario'); render();
  };
  const addV = document.getElementById('addInversion');
  if(addV) addV.onclick = async ()=>{
    const nombre = document.getElementById('vNombre').value.trim();
    const costo = parseFloat(document.getElementById('vCosto').value);
    if(!nombre || !costo) return;
    state.inversion.push({ id:uid(), nombre, costo, ancho: document.getElementById('vAncho').value,
      alto: document.getElementById('vAlto').value, profundidad: document.getElementById('vProf').value,
      detalle: document.getElementById('vDetalle').value });
    await save('inversion'); render();
  };
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = async ()=>{
      const key = el.dataset.del, id = el.dataset.id;
      state[key] = state[key].filter(x=>x.id!==id);
      await save(key); render();
    };
  });
}

(async function init(){
  await loadAll();
  render();
})();
</script>
</body>
</html>
